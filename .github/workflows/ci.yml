
name: Restaurant SQL Quiz CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SQL validation tests
        run: |
          python -m pytest tests/ -v

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py auth.py database.py quiz.py sql_runner.py sql_security.py submissions.py

  database-check:
    name: Supabase Database Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check database credentials
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          QUIZ_DB_USER: ${{ secrets.QUIZ_DB_USER }}
          QUIZ_DB_PASSWORD: ${{ secrets.QUIZ_DB_PASSWORD }}
        run: |
          python scripts/test_sql_permissions.py
